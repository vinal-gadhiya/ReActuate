services:
  supervisor:
    profiles: [agent]
    image: reactuate-supervisor:latest
    build:
      context: .
      dockerfile: inference/Dockerfile.supervisor
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      META_USE_SAM: ${META_USE_SAM:-0}
      META_MAX_OUTPUT_TOKENS: ${META_MAX_OUTPUT_TOKENS:-8192}
      META_SAM_TIMEOUT: ${META_SAM_TIMEOUT:-180}
    networks: [robotics]

  inference:
    image: reactuate-gr00t:latest
    build:
      context: .
      dockerfile: inference/Dockerfile
    runtime: nvidia
    gpus: all
    shm_size: 2gb
    volumes:
      - checkpoints:/checkpoints
      - huggingface-cache:/cache/huggingface
    networks: [robotics]
    # No published host port: the service is accessed over the Docker network.

  sim:
    image: robocasa-thor:latest
    build:
      context: .
      dockerfile: sim/Dockerfile
    runtime: nvidia
    gpus: all
    shm_size: 2gb
    volumes:
      - assets:/opt/robocasa-assets
      - ./outputs:/outputs
    depends_on:
      inference:
        condition: service_healthy
    networks: [robotics]
    command: ["python", "-m", "sim.evaluate"]

networks:
  robotics:

volumes:
  assets:
    name: robocasa-thor-assets
  checkpoints:
    name: ${REACTUATE_CHECKPOINT_VOLUME:-reactuate-checkpoints}
  huggingface-cache:
    name: ${REACTUATE_HF_CACHE_VOLUME:-reactuate-huggingface-cache}
